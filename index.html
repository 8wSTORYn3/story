<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みさこのストーリー集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#1B2563;--ink-soft:#5A6593;--panel:#EAF2F9;--sky:#C9DDEE;--line:#1B2563;--w:170px;--h:302px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New','Poppins',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.04em;}
.wrap{max-width:1040px;margin:0 auto;padding:64px 24px 120px;}
header{text-align:center;margin-bottom:40px;}
h1{font-family:'Poppins','Zen Kaku Gothic New',sans-serif;font-weight:600;font-size:clamp(30px,5.4vw,48px);line-height:1.4;margin:0;letter-spacing:.06em;}
.controls{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;}
.tab{font-family:inherit;font-size:16px;font-weight:500;letter-spacing:.08em;padding:9px 18px;border:none;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;}
.tab:hover{background:var(--panel);}
.tab.active{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--ink);}
.search{position:relative;width:min(100%,320px);}
.search input{width:100%;font-family:inherit;font-size:14px;padding:10px 16px 10px 36px;border-radius:999px;border:1px solid var(--sky);background:#fff;color:var(--ink);outline:none;letter-spacing:.04em;}
.search input:focus{border-color:var(--ink);}
.search::before{content:"";position:absolute;left:14px;top:50%;width:11px;height:11px;transform:translateY(-50%);border:1.5px solid var(--ink-soft);border-radius:50%;}
.search::after{content:"";position:absolute;left:22px;top:60%;width:6px;height:1.5px;background:var(--ink-soft);transform:rotate(45deg);}
.count{font-size:13px;color:var(--ink-soft);margin:28px 0 0;text-align:center;}

.group{padding:72px 0 56px;}
.g-head{display:flex;align-items:center;gap:28px;margin-bottom:44px;}
.g-head::before,.g-head::after{content:"";flex:1;height:1.5px;background:var(--line);}
.g-ttl{text-align:center;}
.g-tag{display:block;margin:0;font-family:'Poppins','Zen Kaku Gothic New',sans-serif;font-weight:600;font-size:clamp(26px,4.6vw,40px);line-height:1.3;letter-spacing:.08em;}
.g-count{display:block;margin-top:8px;font-size:14px;color:var(--ink-soft);letter-spacing:.1em;}
.items{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-end;justify-content:center;margin-bottom:48px;}
.tile{position:relative;width:var(--w);height:var(--h);border-radius:4px;overflow:hidden;box-shadow:0 12px 28px -18px rgba(27,37,99,.45);flex-shrink:0;cursor:zoom-in;}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.tile.broken{cursor:default;}
.tile.broken::after{content:"読み込めません";position:absolute;left:0;right:0;top:50%;text-align:center;font-size:11px;color:#fff;opacity:.9;}
.play{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(27,37,99,.55);pointer-events:none;}
.play::after{content:"";position:absolute;left:21px;top:15px;border-left:17px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;}
.tile.broken .play{display:none;}
.g-text{font-size:16px;line-height:2.2;letter-spacing:.07em;color:var(--ink);margin:0 auto;max-width:34em;white-space:pre-wrap;text-align:center;background:var(--panel);padding:32px 28px;}

.lb{position:fixed;inset:0;background:rgba(14,20,56,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.lb.show{display:flex;}
.lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;}
.lb img{cursor:zoom-out;}
.lb button{position:absolute;border:none;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1;font-family:inherit;z-index:2;}
.lb button:hover{background:rgba(255,255,255,.3);}
.lb .close{top:16px;right:16px;}
.lb .prev{left:16px;top:50%;transform:translateY(-50%);}
.lb .next{right:16px;top:50%;transform:translateY(-50%);}
.lb .cnt{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.8;}
@media (max-width:600px){:root{--w:128px;--h:228px;}.wrap{padding:44px 16px 90px;}.g-head{gap:14px;}.items{gap:20px 14px;}.g-text{font-size:15px;padding:24px 18px;}.tab{font-size:14px;padding:8px 13px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>みさこのストーリー集</h1>
  </header>
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="search"><input type="text" id="searchInput" placeholder="キーワードで検索"></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</div>
<div class="lb" id="lb" role="dialog" aria-label="拡大表示">
  <button class="close" data-a="close" aria-label="閉じる">×</button>
  <button class="prev" data-a="prev" aria-label="前へ">‹</button>
  <img id="lbImg" alt="">
  <video id="lbVideo" controls playsinline></video>
  <button class="next" data-a="next" aria-label="次へ">›</button>
  <span class="cnt" id="lbCnt"></span>
</div>
<script src="stories.js"></script>
<script>
const groups = STORIES.groups.map(g=>({name:g.name,text:g.text,items:(g.items||[]).map(toItem)}));
/* 番号(4) → media/004.jpg ／ "008.mp4" → media/008.mp4 */
function toItem(v){
  if(typeof v==='number'){return {img:'media/'+String(v).padStart(3,'0')+'.jpg'};}
  const f=String(v);
  if(/\.(mp4|mov|webm)$/i.test(f)){return {video:'media/'+f};}
  if(/\.(jpe?g|png|webp)$/i.test(f)){return {img:'media/'+f};}
  if(/^\d+$/.test(f)){return {img:'media/'+f.padStart(3,'0')+'.jpg'};}
  return {img:'media/'+f};
}

const gradients=["linear-gradient(160deg,#BFE3EF,#7FB8CE)","linear-gradient(165deg,#E3F1F6,#B9D9E4)","linear-gradient(180deg,#16303F,#0B1A22)","linear-gradient(180deg,#123249,#0C4258)","linear-gradient(160deg,#D6E9F2,#A9CEDE)","linear-gradient(160deg,#CFE8E4,#9BC9C2)"];
function gradientFor(t){t=t||'未分類';let h=0;for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))%gradients.length;}return gradients[Math.abs(h)];}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

let activeGroup='all',query='',view=[];

function slidesOf(g){
  const out=[];
  g.items.forEach(it=>{
    if(it.video){out.push({type:'video',src:it.video});}
    else if(it.img){out.push({type:'img',src:it.img});}
  });
  return out;
}
function tile(sl,gi,si,cls,name){
  const media = sl.type==='video'
    ? '<video src="'+escapeHtml(sl.src)+'#t=0.1" preload="metadata" muted playsinline onerror="this.parentNode.classList.add(\'broken\');this.remove()"></video><span class="play"></span>'
    : '<img src="'+escapeHtml(sl.src)+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'broken\');this.remove()">';
  return '<div class="tile '+cls+'" data-g="'+gi+'" data-s="'+si+'" style="background:'+gradientFor(name)+'">'+media+'</div>';
}

function renderTabs(){
  const names=groups.map(g=>g.name);
  document.getElementById('tabs').innerHTML='<button class="tab '+(activeGroup==='all'?'active':'')+'" data-g="all">すべて</button>'+names.map(n=>'<button class="tab '+(activeGroup===n?'active':'')+'" data-g="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>').join('');
}
function renderList(){
  let list=groups.filter(g=>activeGroup==='all'||g.name===activeGroup);
  if(query.trim()){const q=query.trim();list=list.filter(g=>(g.name+(g.text||'')).includes(q));}
  view=list;
  document.getElementById('count').textContent=list.length+' グループ表示中';
  const el=document.getElementById('list');
  if(list.length===0){el.innerHTML='<p style="padding:40px 0;color:var(--ink-soft);font-size:13.5px;">該当するグループがありません。</p>';return;}
  el.innerHTML=list.map((g,gi)=>{
    let si=0;
    const items=g.items.map(it=>{
      if(it.video){return tile({type:'video',src:it.video},gi,si++,'',g.name);}
      return tile({type:'img',src:it.img},gi,si++,'',g.name);
    }).join('');
    return '<section class="group"><div class="g-head"><div class="g-ttl"><h2 class="g-tag">'+escapeHtml(g.name)+'</h2><span class="g-count">'+slidesOf(g).length+' 枚</span></div></div><div class="items">'+items+'</div>'+(g.text?'<p class="g-text">'+escapeHtml(g.text)+'</p>':'')+'</section>';
  }).join('');
}
function render(){renderTabs();renderList();}

const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbVideo=document.getElementById('lbVideo'),lbCnt=document.getElementById('lbCnt');
let lbSlides=[],lbPos=0;
function showLb(){
  const s=lbSlides[lbPos];
  lbVideo.pause();
  if(s.type==='video'){lbImg.style.display='none';lbImg.removeAttribute('src');lbVideo.style.display='block';lbVideo.src=s.src;var pr=lbVideo.play();if(pr&&pr.catch)pr.catch(function(){});}
  else{lbVideo.style.display='none';lbVideo.removeAttribute('src');lbImg.style.display='block';lbImg.src=s.src;}
  lbCnt.textContent=(lbPos+1)+' / '+lbSlides.length;
  lb.querySelector('.prev').style.display=lb.querySelector('.next').style.display=lbSlides.length>1?'':'none';
  lb.classList.add('show');
  document.body.style.overflow='hidden';
}
function openLb(gi,si){lbSlides=slidesOf(view[gi]);lbPos=si;showLb();}
function closeLb(){lbVideo.pause();lbVideo.removeAttribute('src');lbImg.removeAttribute('src');lb.classList.remove('show');document.body.style.overflow='';}
function stepLb(d){lbPos=(lbPos+d+lbSlides.length)%lbSlides.length;showLb();}

document.getElementById('list').addEventListener('click',ev=>{
  const t=ev.target.closest('.tile');
  if(!t||t.classList.contains('broken'))return;
  openLb(Number(t.dataset.g),Number(t.dataset.s));
});
lb.addEventListener('click',ev=>{
  if(ev.target===lbVideo)return;
  const b=ev.target.closest('button');
  if(b){if(b.dataset.a==='prev')stepLb(-1);else if(b.dataset.a==='next')stepLb(1);else closeLb();return;}
  closeLb();
});
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('show'))return;
  if(ev.key==='Escape')closeLb();
  else if(ev.key==='ArrowLeft')stepLb(-1);
  else if(ev.key==='ArrowRight')stepLb(1);
});
document.getElementById('tabs').addEventListener('click',ev=>{const b=ev.target.closest('.tab');if(!b)return;activeGroup=b.dataset.g;render();});
document.getElementById('searchInput').addEventListener('input',ev=>{query=ev.target.value;renderList();});
render();
</script>
</body>
</html>
