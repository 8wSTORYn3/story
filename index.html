<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みさこのストーリー集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F7F9;--ink:#1C2E38;--ink-soft:#5C7480;--rose:#2B7A9E;--rose-deep:#1B5A78;--card:#FFFFFF;--line:#D9E6EB;--w:150px;--h:267px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New', sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:920px;margin:0 auto;padding:56px 24px 100px;}
header{margin-bottom:36px;}
.kicker{font-size:12.5px;letter-spacing:.14em;color:var(--rose-deep);margin:0 0 10px;font-weight:500;}
h1{font-family:'Shippori Mincho', serif;font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.35;margin:0;}
h1 .accent{color:var(--rose);}
.controls{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tab{font-family:inherit;font-size:15px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.search{position:relative;min-width:200px;}
.search input{width:100%;font-family:inherit;font-size:14px;padding:9px 14px 9px 32px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;}
.search input:focus{border-color:var(--rose);}
.search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;transform:translateY(-50%);border:1.5px solid var(--ink-soft);border-radius:50%;}
.search::after{content:"";position:absolute;left:20px;top:60%;width:6px;height:1.5px;background:var(--ink-soft);transform:rotate(45deg);}
.count{font-size:13px;color:var(--ink-soft);margin:18px 2px 0;}

.group{padding:36px 0;border-bottom:1px solid var(--line);}
.g-head{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
.g-tag{font-size:clamp(22px,3.6vw,30px);font-weight:700;color:var(--rose-deep);background:#EAF4F8;border:1px solid #C7DEE7;padding:8px 26px;border-radius:999px;line-height:1.4;}
.g-count{font-size:15px;color:var(--ink-soft);}
.items{display:flex;flex-wrap:wrap;gap:22px 20px;align-items:flex-end;margin-bottom:24px;}
.tile{position:relative;width:var(--w);height:var(--h);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px -14px rgba(28,46,56,.35);flex-shrink:0;cursor:zoom-in;}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.tile.broken{cursor:default;}
.tile.broken::after{content:"読み込めません";position:absolute;left:0;right:0;top:50%;text-align:center;font-size:11px;color:#fff;opacity:.9;}
.play{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(0,0,0,.45);pointer-events:none;}
.play::after{content:"";position:absolute;left:19px;top:14px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;}
.tile.broken .play{display:none;}
.g-text{font-size:16px;line-height:2;color:var(--ink);margin:0;max-width:60ch;white-space:pre-wrap;}

.sec2{margin-top:72px;padding-top:56px;border-top:3px solid var(--rose);}
.sec2 .kicker{margin-bottom:8px;}
.sec2 h2{font-family:'Shippori Mincho', serif;font-weight:700;font-size:clamp(24px,4vw,34px);line-height:1.4;margin:0;}
.sec2 h2 .accent{color:var(--rose);}
.lb{position:fixed;inset:0;background:rgba(10,20,26,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.lb.show{display:flex;}
.lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;}
.lb img{cursor:zoom-out;}
.lb button{position:absolute;border:none;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1;font-family:inherit;z-index:2;}
.lb button:hover{background:rgba(255,255,255,.3);}
.lb .close{top:16px;right:16px;}
.lb .prev{left:16px;top:50%;transform:translateY(-50%);}
.lb .next{right:16px;top:50%;transform:translateY(-50%);}
.lb .cnt{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.8;}
@media (max-width:600px){:root{--w:112px;--h:199px;}.wrap{padding:40px 18px 80px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">STORY DESIGN NOTE</p>
    <h1>みさこの<span class="accent">ストーリー集</span></h1>
  </header>
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="search"><input type="text" id="searchInput" placeholder="キーワードで検索"></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>

  <div class="sec2" id="sec2">
    <p class="kicker">STUDENT STORIES</p>
    <h2><span class="accent">受講生 まなみさん</span>のストーリー</h2>
    <div class="controls"><div class="tabs" id="tabs2"></div></div>
    <p class="count" id="count2"></p>
    <div id="list2"></div>
  </div>
</div>
<div class="lb" id="lb" role="dialog" aria-label="拡大表示">
  <button class="close" data-a="close" aria-label="閉じる">×</button>
  <button class="prev" data-a="prev" aria-label="前へ">‹</button>
  <img id="lbImg" alt="">
  <video id="lbVideo" controls playsinline></video>
  <button class="next" data-a="next" aria-label="次へ">›</button>
  <span class="cnt" id="lbCnt"></span>
</div>
<script src="stories.js"></script>
<script>
/* 番号(4) → media/004.jpg ／ "008.mp4" → media/008.mp4 ／ 受講生は prefix="media/manami/" */
function toItem(v,pre){
  pre=pre||'media/';
  if(typeof v==='number'){return {img:pre+(pre==='media/'?String(v).padStart(3,'0'):v)+'.jpg'};}
  const f=String(v);
  if(/\.(mp4|mov|webm)$/i.test(f)){return {video:pre+f};}
  if(/\.(jpe?g|png|webp)$/i.test(f)){return {img:pre+f};}
  if(/^\d+$/.test(f)){return {img:pre+(pre==='media/'?f.padStart(3,'0'):f)+'.jpg'};}
  return {img:pre+f};
}
const gradients=["linear-gradient(160deg,#BFE3EF,#7FB8CE)","linear-gradient(165deg,#E3F1F6,#B9D9E4)","linear-gradient(180deg,#16303F,#0B1A22)","linear-gradient(180deg,#123249,#0C4258)","linear-gradient(160deg,#D6E9F2,#A9CEDE)","linear-gradient(160deg,#CFE8E4,#9BC9C2)"];
function gradientFor(t){t=t||'未分類';let h=0;for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))%gradients.length;}return gradients[Math.abs(h)];}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function slidesOf(g){
  const out=[];
  g.items.forEach(it=>{
    if(it.video){out.push({type:'video',src:it.video});}
    else if(it.img){out.push({type:'img',src:it.img});}
  });
  return out;
}
function tile(sl,gi,si,name,sec){
  const media = sl.type==='video'
    ? '<video src="'+escapeHtml(sl.src)+'#t=0.1" preload="metadata" muted playsinline onerror="this.parentNode.classList.add(\'broken\');this.remove()"></video><span class="play"></span>'
    : '<img src="'+escapeHtml(sl.src)+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'broken\');this.remove()">';
  return '<div class="tile" data-sec="'+sec+'" data-g="'+gi+'" data-s="'+si+'" style="background:'+gradientFor(name)+'">'+media+'</div>';
}

/* セクション(みさこ / 受講生)ごとの状態 */
const sections=[
  {data:STORIES, pre:'media/', tabs:'tabs', list:'list', count:'count', active:'all', query:'', view:[]},
  {data:(typeof STUDENT!=='undefined'?STUDENT:null), pre:'media/manami/', tabs:'tabs2', list:'list2', count:'count2', active:'all', query:'', view:[]}
];
sections.forEach(S=>{
  S.groups=S.data?S.data.groups.map(g=>({name:g.name,text:g.text,items:(g.items||[]).map(v=>toItem(v,S.pre))})):[];
});
if(!sections[1].data){document.getElementById('sec2').style.display='none';}

function renderTabs(S){
  const names=S.groups.map(g=>g.name);
  document.getElementById(S.tabs).innerHTML='<button class="tab '+(S.active==='all'?'active':'')+'" data-g="all">すべて</button>'+names.map(n=>'<button class="tab '+(S.active===n?'active':'')+'" data-g="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>').join('');
}
function renderList(S,si0){
  let list=S.groups.filter(g=>S.active==='all'||g.name===S.active);
  if(S.query.trim()){const q=S.query.trim();list=list.filter(g=>(g.name+(g.text||'')).includes(q));}
  S.view=list;
  document.getElementById(S.count).textContent=list.length+' グループ表示中';
  const el=document.getElementById(S.list);
  if(list.length===0){el.innerHTML='<p style="padding:40px 0;color:var(--ink-soft);font-size:13.5px;">該当するグループがありません。</p>';return;}
  el.innerHTML=list.map((g,gi)=>{
    let si=0;
    const items=g.items.map(it=>{
      if(it.video){return tile({type:'video',src:it.video},gi,si++,g.name,si0);}
      return tile({type:'img',src:it.img},gi,si++,g.name,si0);
    }).join('');
    return '<section class="group"><div class="g-head"><span class="g-tag">'+escapeHtml(g.name)+'</span><span class="g-count">'+slidesOf(g).length+' 枚</span></div><div class="items">'+items+'</div>'+(g.text?'<p class="g-text">'+escapeHtml(g.text)+'</p>':'')+'</section>';
  }).join('');
}
function render(i){renderTabs(sections[i]);renderList(sections[i],i);}

const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbVideo=document.getElementById('lbVideo'),lbCnt=document.getElementById('lbCnt');
let lbSlides=[],lbPos=0;
function showLb(){
  const s=lbSlides[lbPos];
  lbVideo.pause();
  if(s.type==='video'){lbImg.style.display='none';lbImg.removeAttribute('src');lbVideo.style.display='block';lbVideo.src=s.src;var pr=lbVideo.play();if(pr&&pr.catch)pr.catch(function(){});}
  else{lbVideo.style.display='none';lbVideo.removeAttribute('src');lbImg.style.display='block';lbImg.src=s.src;}
  lbCnt.textContent=(lbPos+1)+' / '+lbSlides.length;
  lb.querySelector('.prev').style.display=lb.querySelector('.next').style.display=lbSlides.length>1?'':'none';
  lb.classList.add('show');
  document.body.style.overflow='hidden';
}
function openLb(sec,gi,si){lbSlides=slidesOf(sections[sec].view[gi]);lbPos=si;showLb();}
function closeLb(){lbVideo.pause();lbVideo.removeAttribute('src');lbImg.removeAttribute('src');lb.classList.remove('show');document.body.style.overflow='';}
function stepLb(d){lbPos=(lbPos+d+lbSlides.length)%lbSlides.length;showLb();}

['list','list2'].forEach(id=>document.getElementById(id).addEventListener('click',ev=>{
  const t=ev.target.closest('.tile');
  if(!t||t.classList.contains('broken'))return;
  openLb(Number(t.dataset.sec),Number(t.dataset.g),Number(t.dataset.s));
}));
lb.addEventListener('click',ev=>{
  if(ev.target===lbVideo)return;
  const b=ev.target.closest('button');
  if(b){if(b.dataset.a==='prev')stepLb(-1);else if(b.dataset.a==='next')stepLb(1);else closeLb();return;}
  closeLb();
});
document.addEventListener('keydown',ev=>{
  if(!lb.classList.contains('show'))return;
  if(ev.key==='Escape')closeLb();
  else if(ev.key==='ArrowLeft')stepLb(-1);
  else if(ev.key==='ArrowRight')stepLb(1);
});
['tabs','tabs2'].forEach((id,i)=>document.getElementById(id).addEventListener('click',ev=>{const b=ev.target.closest('.tab');if(!b)return;sections[i].active=b.dataset.g;render(i);}));
document.getElementById('searchInput').addEventListener('input',ev=>{sections[0].query=ev.target.value;renderList(sections[0],0);});
render(0);render(1);
</script>
</body>
</html>
